name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PayPilot.slnx

      - name: Build
        run: dotnet build PayPilot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PayPilot.slnx --no-build --configuration Release

  angular:
    name: Angular build & format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Presentation/paypilot-web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/Presentation/paypilot-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build